<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthioTrip | Destinations with Descriptions</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #2d3436;
        }

        :root {
            --primary: #2d3436;
            --accent: #d4af37;
            --text-light: #636e72;
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 8%;
            background: white;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--primary);
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Header */
        .destination-header {
            text-align: center;
            padding: 60px 8% 30px;
            background: linear-gradient(180deg, #faf9f5, #ffffff);
        }

        .destination-header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .destination-header p {
            color: var(--text-light);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Destinations Grid */
        .destinations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 35px;
            padding: 40px 8% 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .dest-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }

        .dest-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
        }

        .dest-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: 0.5s;
            display: block;
        }

        .dest-card:hover img {
            transform: scale(1.02);
        }

        .dest-content {
            padding: 25px;
        }

        .dest-location {
            color: var(--accent);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .dest-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .dest-description {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .dest-short-desc {
            color: #7f8c8d;
            font-size: 0.85rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        

        .btn-details {
            padding: 12px 24px;
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 50px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .btn-details:hover {
            background: var(--accent);
            color: #2d3436;
            transform: translateY(-2px);
        }

        /* Modal Styles - Full Description */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-container {
            background: white;
            border-radius: 32px;
            max-width: 750px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            animation: modalSlideUp 0.4s ease;
        }

        @keyframes modalSlideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: var(--accent);
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2d3436;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #2d3436;
            transition: 0.3s;
        }

        .close-modal:hover {
            transform: scale(1.1);
        }

        .modal-body {
            padding: 30px;
        }

        .modal-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 20px;
            display: block;
        }

        .modal-full-description {
            color: #2d3436;
            line-height: 1.8;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .modal-highlights {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
        }

        .modal-highlights h4 {
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .modal-highlights ul {
            list-style: none;
            padding-left: 0;
        }

        .modal-highlights li {
            padding: 6px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-highlights li i {
            color: var(--accent);
            width: 20px;
        }

        .btn-book-now {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            text-align: center;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 15px;
        }

        .btn-book-now:hover {
            background: var(--accent);
            color: #2d3436;
        }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthioTrip | Destinations</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/ethiotrip1/ethiotrip/public/css/destination.css">
    <link rel="stylesheet" href="/ethiotrip1/ethiotrip/public/css/responsive.css">
    <style>
        .btn-select {
            padding: 16px;
            background: #2d3436;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }
        .btn-select:hover { background: #d4af37; transform: translateY(-2px); }
        .destinations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            padding: 40px 8%;
        }
        .dest-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: 0.4s ease;
            border: 2px solid transparent;
        }
        .dest-card:hover { transform: translateY(-10px); border-color: #d4af37; }
        .dest-card img { width: 100%; height: 250px; object-fit: cover; }
        .dest-content { padding: 25px; }
        .dest-location { color: #d4af37; font-size: 0.8rem; margin-bottom: 10px; }
        .dest-desc { color: #666; font-size: 0.85rem; line-height: 1.5; }
        .state-msg { text-align: center; padding: 40px; color: #636e72; grid-column: 1 / -1; }
        .state-error { color: #c0392b; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/ethiotrip1/ethiotrip/public/" class="logo">Ethio<span>Trip</span></a>
        <ul class="nav-links">
            <li><a href="/ethiotrip1/ethiotrip/public/">Home</a></li>
            <li><a href="/ethiotrip1/ethiotrip/public/destination">Destinations</a></li>
            <li><a href="/ethiotrip1/ethiotrip/public/packages">Packages</a></li>
            <li><a href="/ethiotrip1/ethiotrip/public/about">About</a></li>
            <li><a href="/ethiotrip1/ethiotrip/public/login">Sign In</a></li>
        </ul>
    </nav>

    <div class="destination-header">
        <h1>Explore Ethiopia</h1>
        <p>Browse destinations, read full travel guides, then choose packages for your journey.</p>
    </div>

    <div class="destinations-grid" id="destinationsGrid">
        <p class="state-msg" id="destinationsLoading">Loading destinations...</p>
        <p class="state-msg" id="destinationsEmpty" style="display:none;">No destinations available yet.</p>
        <p class="state-msg state-error" id="destinationsError" style="display:none;"></p>
    </div>

    <footer class="footer">
        <div class="footer-bottom">© <span id="currentYear"></span> EthioTrip Ethiopia.</div>
    </footer>

    <script>document.getElementById('currentYear').textContent = new Date().getFullYear();</script>
    <script src="/ethiotrip1/ethiotrip/public/js/ethiotrip-config.js"></script>
    <script src="/ethiotrip1/ethiotrip/public/js/ethiotrip-api.js"></script>
    <script src="/ethiotrip1/ethiotrip/public/js/destinations.js"></script>
    <script src="/ethiotrip1/ethiotrip/public/js/nav-mobile.js"></script>
</body>
</html>
